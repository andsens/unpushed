name: Test

on:
  # ** rather than *, so pushes to branches with a slash in the name - which
  # is every branch Dependabot opens - are tested too.
  push:
    branches: ['**']
    tags: ['!v*']
  workflow_call: {}
  # So the checks can be re-run by hand.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: experimental-features = nix-command flakes
    # The build runs go test, and fails when vendorHash doesn't match go.sum
    - name: Build the package
      run: nix build --print-build-logs .#default
    # The build already ran the tests, this runs them again for a report
    - name: Test
      run: nix develop .#default -c bash -c 'cd src && GOFLAGS=-mod=mod go tool gotestsum --junitfile ../test-results.xml -- -tags wayland,migrated_fynedo ./...'
    - name: Summarize the tests
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
      if: always()
      with:
        paths: test-results.xml
    - name: Check formatting
      run: |
        unformatted=$(nix shell .#default.go -c gofmt -l src)
        [[ -z $unformatted ]] || { echo "gofmt wants to change:"; echo "$unformatted"; exit 1; }
    - name: Check the flake
      run: nix flake check

  # The nix job covers Linux. These build and test the code that only compiles
  # elsewhere: the directory walk, the terminals and fyne's folder dialog.
  go:
    strategy:
      # Each platform's failures are worth seeing
      fail-fast: false
      matrix:
        runner: [macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: src/go.mod
        cache-dependency-path: src/go.sum
    - name: Test
      env:
        CGO_ENABLED: "1"
      run: go tool gotestsum --junitfile ../test-results.xml -- -tags migrated_fynedo ./...
    - name: Summarize the tests
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
      if: always()
      with:
        paths: test-results.xml
